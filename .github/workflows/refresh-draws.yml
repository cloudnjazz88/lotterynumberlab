name: Refresh lottery snapshot

on:
  schedule:
    # 12:00 UTC is 8:00 a.m. EDT / 7:00 a.m. EST — after overnight official posts.
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch and validate official draws
        run: node tools/fetch-draws.mjs
      - name: Fetch official jackpot estimates
        run: node tools/fetch-jackpots.mjs
      - name: Validate snapshot statistics
        run: node tools/validate.mjs
      - name: Validate jackpot parsers
        run: node tools/jackpot-validate-test.mjs
      - name: Build site
        run: node tools/build-site.mjs
      - name: Verify SEO assets
        run: node tools/verify-seo.mjs
      - name: Commit only when snapshots changed
        run: |
          if git diff --quiet -- data/draws.json data/draws.js data/jackpots.json; then
            echo "No snapshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/draws.json data/draws.js data/jackpots.json
          if git diff --cached --quiet -- data/draws.json data/draws.js; then
            git commit -m "chore: refresh official jackpot estimates"
          elif git diff --cached --quiet -- data/jackpots.json; then
            git commit -m "chore: refresh verified lottery draw snapshot"
          else
            git commit -m "chore: refresh verified lottery snapshot"
          fi
          git push
