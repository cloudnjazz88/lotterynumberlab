# Static site plus a tiny Worker to serve sitemap.xml and favicon.svg.
name = "lotterynumberlab"
main = "worker.js"
compatibility_date = "2026-08-24"

[assets]
directory = "./dist"
binding = "ASSETS"
# Worker must run first so www → apex redirects are not skipped by static assets.
run_worker_first = true

routes = [
  { pattern = "lotterynumberlab.com", custom_domain = true },
  { pattern = "www.lotterynumberlab.com", custom_domain = true },
]
